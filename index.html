<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screenshot to Code</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>📸 Screenshot to Code</h1>
<p>Upload screenshot → Get HTML + Tailwind</p>
</header>

<main>
<div class="card">
<h3>Upload</h3>
<input type="file" id="fileInput" accept="image/*">
<img id="previewImg" class="hidden">
</div>

<div class="card">
<button id="genBtn">⚡ Generate Code</button>
<div class="tabs">
<button onclick="showTab('html')" class="tab active">HTML</button>
<button onclick="showTab('preview')" class="tab">Preview</button>
</div>
<textarea id="codeOutput"></textarea>
<div id="previewOutput" class="hidden"></div>
<button id="copyBtn">📋 Copy</button>
</div>
</main>

<script src="app.js"></script>
</body>
</html>
